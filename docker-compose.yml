# Docker Compose for BizConnect Production Deployment
# Ubuntu 24.04 with PostgreSQL 16

version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:16
    container_name: bizconnect-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: bizconnect_prod
      POSTGRES_USER: bizconnect
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_HOST_AUTH_METHOD: scram-sha-256
      POSTGRES_INITDB_ARGS: "--auth-host=scram-sha-256 --auth-local=scram-sha-256"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./db/migrations:/docker-entrypoint-initdb.d:ro
      - ./backups:/backups
    ports:
      - "5432:5432"
    networks:
      - bizconnect-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U bizconnect -d bizconnect_prod"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 30s

  # BizConnect Web Application
  bizconnect-app:
    image: ${CI_REGISTRY_IMAGE}/bizconnect:latest
    container_name: bizconnect-app
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: http://+:8080
      ConnectionStrings__DefaultConnection: "Host=postgres;Database=bizconnect_prod;Username=bizconnect;Password=${POSTGRES_PASSWORD}"
      DOTNET_RUNNING_IN_CONTAINER: "true"
    ports:
      - "8080:8080"
    volumes:
      - app_logs:/app/logs
      - app_uploads:/app/uploads
    networks:
      - bizconnect-network
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8080/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # Nginx Reverse Proxy
  nginx:
    image: nginx:alpine
    container_name: bizconnect-nginx
    restart: unless-stopped
    depends_on:
      bizconnect-app:
        condition: service_healthy
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/conf.d:/etc/nginx/conf.d:ro
      - ./ssl:/etc/nginx/ssl:ro
      - nginx_logs:/var/log/nginx
    networks:
      - bizconnect-network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/health"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Redis Cache (Optional)
  redis:
    image: redis:7-alpine
    container_name: bizconnect-redis
    restart: unless-stopped
    command: redis-server --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    networks:
      - bizconnect-network
    healthcheck:
      test: ["CMD", "redis-cli", "--raw", "incr", "ping"]
      interval: 30s
      timeout: 10s
      retries: 3

  # Backup Service
  backup:
    image: postgres:16
    container_name: bizconnect-backup
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGPASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - ./backups:/backups
      - ./scripts:/scripts:ro
    networks:
      - bizconnect-network
    command: >
      sh -c "
        echo 'Starting backup service...'
        while true; do
          echo 'Creating database backup...'
          pg_dump -h postgres -U bizconnect -d bizconnect_prod > /backups/bizconnect_backup_$$(date +%Y%m%d_%H%M%S).sql
          echo 'Backup completed'
          # Keep only last 7 days of backups
          find /backups -name '*.sql' -mtime +7 -delete
          sleep 86400  # Wait 24 hours
        done
      "
    profiles:
      - backup

networks:
  bizconnect-network:
    driver: bridge
    name: bizconnect-network

volumes:
  postgres_data:
    name: bizconnect-postgres-data
  app_logs:
    name: bizconnect-app-logs
  app_uploads:
    name: bizconnect-app-uploads
  nginx_logs:
    name: bizconnect-nginx-logs
  redis_data:
    name: bizconnect-redis-data
