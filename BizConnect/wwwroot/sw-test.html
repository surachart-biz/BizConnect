<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Service Worker Test - BizConnect</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        .status-indicator {
            width: 12px;
            height: 12px;
            border-radius: 50%;
            display: inline-block;
            margin-right: 8px;
        }
        .status-success { background-color: #28a745; }
        .status-warning { background-color: #ffc107; }
        .status-error { background-color: #dc3545; }
        .status-info { background-color: #17a2b8; }
        
        .log-container {
            background-color: #f8f9fa;
            border: 1px solid #dee2e6;
            border-radius: 0.375rem;
            padding: 1rem;
            max-height: 300px;
            overflow-y: auto;
            font-family: 'Courier New', monospace;
            font-size: 0.875rem;
        }
        
        .log-entry {
            margin-bottom: 0.25rem;
            padding: 0.25rem;
            border-radius: 0.25rem;
        }
        
        .log-info { background-color: #d1ecf1; color: #0c5460; }
        .log-success { background-color: #d4edda; color: #155724; }
        .log-warning { background-color: #fff3cd; color: #856404; }
        .log-error { background-color: #f8d7da; color: #721c24; }
    </style>
</head>
<body>
    <div class="container mt-4">
        <div class="row">
            <div class="col-12">
                <h1 class="mb-4">
                    <i class="fas fa-cogs"></i> Service Worker Test Dashboard
                </h1>
                
                <!-- Status Cards -->
                <div class="row mb-4">
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">SW Support</h5>
                                <div id="sw-support-status">
                                    <span class="status-indicator status-info"></span>
                                    <span>Checking...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">Registration</h5>
                                <div id="sw-registration-status">
                                    <span class="status-indicator status-info"></span>
                                    <span>Checking...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">Controller</h5>
                                <div id="sw-controller-status">
                                    <span class="status-indicator status-info"></span>
                                    <span>Checking...</span>
                                </div>
                            </div>
                        </div>
                    </div>
                    <div class="col-md-3">
                        <div class="card">
                            <div class="card-body text-center">
                                <h5 class="card-title">Update Available</h5>
                                <div id="sw-update-status">
                                    <span class="status-indicator status-success"></span>
                                    <span>No</span>
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Action Buttons -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Actions</h5>
                            </div>
                            <div class="card-body">
                                <button id="btn-check-update" class="btn btn-primary me-2">Check for Updates</button>
                                <button id="btn-force-update" class="btn btn-warning me-2">Force Update</button>
                                <button id="btn-unregister" class="btn btn-danger me-2">Unregister SW</button>
                                <button id="btn-clear-cache" class="btn btn-secondary me-2">Clear Cache</button>
                                <button id="btn-get-version" class="btn btn-info">Get Version</button>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Cache Information -->
                <div class="row mb-4">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header">
                                <h5 class="mb-0">Cache Information</h5>
                            </div>
                            <div class="card-body">
                                <div id="cache-info">Loading cache information...</div>
                            </div>
                        </div>
                    </div>
                </div>
                
                <!-- Log Output -->
                <div class="row">
                    <div class="col-12">
                        <div class="card">
                            <div class="card-header d-flex justify-content-between align-items-center">
                                <h5 class="mb-0">Console Log</h5>
                                <button id="btn-clear-log" class="btn btn-sm btn-outline-secondary">Clear Log</button>
                            </div>
                            <div class="card-body">
                                <div id="log-container" class="log-container"></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        class ServiceWorkerTester {
            constructor() {
                this.logContainer = document.getElementById('log-container');
                this.init();
            }
            
            init() {
                this.setupEventListeners();
                this.checkServiceWorkerSupport();
                this.updateStatus();
                this.loadCacheInfo();
                
                // Update status every 5 seconds
                setInterval(() => this.updateStatus(), 5000);
            }
            
            setupEventListeners() {
                document.getElementById('btn-check-update').addEventListener('click', () => this.checkForUpdates());
                document.getElementById('btn-force-update').addEventListener('click', () => this.forceUpdate());
                document.getElementById('btn-unregister').addEventListener('click', () => this.unregisterServiceWorker());
                document.getElementById('btn-clear-cache').addEventListener('click', () => this.clearCache());
                document.getElementById('btn-get-version').addEventListener('click', () => this.getVersion());
                document.getElementById('btn-clear-log').addEventListener('click', () => this.clearLog());
            }
            
            log(message, type = 'info') {
                const timestamp = new Date().toLocaleTimeString();
                const logEntry = document.createElement('div');
                logEntry.className = `log-entry log-${type}`;
                logEntry.textContent = `[${timestamp}] ${message}`;
                
                this.logContainer.appendChild(logEntry);
                this.logContainer.scrollTop = this.logContainer.scrollHeight;
                
                console.log(`[SW Test] ${message}`);
            }
            
            clearLog() {
                this.logContainer.innerHTML = '';
            }
            
            updateStatusIndicator(elementId, status, text) {
                const element = document.getElementById(elementId);
                const indicator = element.querySelector('.status-indicator');
                const textSpan = element.querySelector('span:last-child');
                
                indicator.className = `status-indicator status-${status}`;
                textSpan.textContent = text;
            }
            
            checkServiceWorkerSupport() {
                const supported = 'serviceWorker' in navigator;
                this.updateStatusIndicator('sw-support-status', 
                    supported ? 'success' : 'error', 
                    supported ? 'Supported' : 'Not Supported'
                );
                this.log(`Service Worker support: ${supported ? 'Yes' : 'No'}`, supported ? 'success' : 'error');
            }
            
            async updateStatus() {
                if (!('serviceWorker' in navigator)) return;
                
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    
                    // Registration status
                    this.updateStatusIndicator('sw-registration-status',
                        registration ? 'success' : 'warning',
                        registration ? 'Registered' : 'Not Registered'
                    );
                    
                    // Controller status
                    this.updateStatusIndicator('sw-controller-status',
                        navigator.serviceWorker.controller ? 'success' : 'warning',
                        navigator.serviceWorker.controller ? 'Active' : 'No Controller'
                    );
                    
                    // Update status
                    if (window.swManager) {
                        const status = window.swManager.getStatus();
                        this.updateStatusIndicator('sw-update-status',
                            status.isUpdateAvailable ? 'warning' : 'success',
                            status.isUpdateAvailable ? 'Yes' : 'No'
                        );
                    }
                    
                } catch (error) {
                    this.log(`Error updating status: ${error.message}`, 'error');
                }
            }
            
            async checkForUpdates() {
                this.log('Checking for updates...', 'info');
                
                if (window.swManager) {
                    try {
                        await window.swManager.forceUpdate();
                        this.log('Update check completed', 'success');
                    } catch (error) {
                        this.log(`Update check failed: ${error.message}`, 'error');
                    }
                } else {
                    this.log('Service Worker Manager not available', 'warning');
                }
            }
            
            async forceUpdate() {
                this.log('Forcing update...', 'info');
                
                if (window.swManager) {
                    try {
                        await window.swManager.skipWaiting();
                        this.log('Force update initiated', 'success');
                    } catch (error) {
                        this.log(`Force update failed: ${error.message}`, 'error');
                    }
                } else {
                    this.log('Service Worker Manager not available', 'warning');
                }
            }
            
            async unregisterServiceWorker() {
                this.log('Unregistering Service Worker...', 'info');
                
                try {
                    const registration = await navigator.serviceWorker.getRegistration();
                    if (registration) {
                        await registration.unregister();
                        this.log('Service Worker unregistered successfully', 'success');
                        setTimeout(() => location.reload(), 1000);
                    } else {
                        this.log('No Service Worker registration found', 'warning');
                    }
                } catch (error) {
                    this.log(`Unregistration failed: ${error.message}`, 'error');
                }
            }
            
            async clearCache() {
                this.log('Clearing cache...', 'info');
                
                try {
                    const cacheNames = await caches.keys();
                    await Promise.all(cacheNames.map(name => caches.delete(name)));
                    this.log(`Cleared ${cacheNames.length} cache(s)`, 'success');
                    this.loadCacheInfo();
                } catch (error) {
                    this.log(`Cache clearing failed: ${error.message}`, 'error');
                }
            }
            
            async getVersion() {
                this.log('Getting Service Worker version...', 'info');
                
                if (window.swManager) {
                    try {
                        const version = await window.swManager.getServiceWorkerVersion();
                        this.log(`Service Worker version: ${version || 'Unknown'}`, 'info');
                    } catch (error) {
                        this.log(`Version check failed: ${error.message}`, 'error');
                    }
                } else {
                    this.log('Service Worker Manager not available', 'warning');
                }
            }
            
            async loadCacheInfo() {
                try {
                    const cacheNames = await caches.keys();
                    const cacheInfo = document.getElementById('cache-info');
                    
                    if (cacheNames.length === 0) {
                        cacheInfo.innerHTML = '<em>No caches found</em>';
                        return;
                    }
                    
                    let html = '<ul class="list-unstyled">';
                    for (const cacheName of cacheNames) {
                        const cache = await caches.open(cacheName);
                        const keys = await cache.keys();
                        html += `<li><strong>${cacheName}</strong>: ${keys.length} entries</li>`;
                    }
                    html += '</ul>';
                    
                    cacheInfo.innerHTML = html;
                } catch (error) {
                    document.getElementById('cache-info').innerHTML = `<em>Error loading cache info: ${error.message}</em>`;
                }
            }
        }
        
        // Initialize when DOM is ready
        if (document.readyState === 'loading') {
            document.addEventListener('DOMContentLoaded', () => {
                new ServiceWorkerTester();
            });
        } else {
            new ServiceWorkerTester();
        }
    </script>
</body>
</html>
